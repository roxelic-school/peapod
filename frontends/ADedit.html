<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Upload</title>
</head>
<body>
    <h1>Upload Text</h1>

    <p>option</p>
    <select name="option" id="option">
        <option value="delete_date">delete date content</option>
        <option value="delete_slot">delete slot</option>
        <option value="force_slot">force slot</option>
        <option value="reset">reset</option>
    </select>

    <p>date</p>
    <input type="text" id="date" placeholder="HA" />

    <p>content</p>
    <input type="text" id="content" placeholder="ah" />

    <p>index</p>
    <input type="number" id="index" name="index" min="0" max="6">

    <button id="submitBtn">Submit</button>

    <script>
        document.getElementById("submitBtn").addEventListener("click", async function () {
            // Get the values from the inputs
            const option = document.getElementById("option").value;
            const content = JSON.parse(document.getElementById("content").value);
            const date = document.getElementById("date").value;
            const index = document.getElementById("index").value;

            const formattedData = {
                option,
                content,
                date,
                index
            };

            // Send the data as a POST request
            try {
                const response = await fetch("http://localhost:3000/api/v1/admin/edit", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ text: formattedData })
                });

                const result = await response.json();
                alert(`Response: ${JSON.stringify(result)}`);
            } catch (error) {
                console.error("Error:", error);
                alert("An error occurred while sending the request.");
            }
        });
    </script>
</body>
</html>
